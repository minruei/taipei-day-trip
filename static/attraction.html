<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attraction</title>
  <link rel="stylesheet" href="/static/attraction/attraction.css">
  <link rel="stylesheet" href="/static/dialog/dialog.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a class="logo" href="/">台北一日遊</a>
      <ul>
        <li id="booking-nav">預定行程</li>
        <li id="auth-nav">登入/註冊</li>
      </ul>
    </div>
  </nav>

  <section class="attraction-main">

    <!-- 左半邊：圖片輪播 -->
    <div class="picture-current">
      <img class="carousel-img" src="" alt="">
      <button class="carousel-arrow-left"><img src="/static/images/btn_leftArrow.svg" alt="上一張"></button>
      <button class="carousel-arrow-right"><img src="/static/images/btn_rightArrow.svg" alt="下一張"></button>
      <div class="indicator-bar"></div>
    </div>

    <!-- 右半邊：景點資訊 + 預約表單 -->
    <div class="profile">
      <h1 class="attraction-name"></h1>
      <p class="attraction-category-mrt"></p>

      <div class="booking-form">
        <h2>訂購導覽行程</h2>
        <p>以此景點為中心的一日行程，帶您探索城市角落故事</p>

        <div class="field-date">
          <label>選擇日期：</label>
          <input type="date" id="booking-date">
        </div>

        <div class="field-time">
          <label>選擇時間：</label>
          <label><input type="radio" name="time" value="morning"> 上半天</label>
          <label><input type="radio" name="time" value="afternoon"> 下半天</label>
        </div>

        <div class="field-price">
          <label>導覽費用：</label>
          <span class="price-value"></span>
        </div>

        <button class="booking-btn">開始預約行程</button>
      </div>
    </div>

  </section>

  <!-- 景點描述、地址、交通方式 -->
  <div class="infors">
    <p class="attraction-description"></p>
    <p class="section-label"><strong>景點地址：</strong></p>
    <p class="attraction-address"></p>
    <p class="section-label"><strong>交通方式：</strong></p>
    <p class="attraction-transport"></p>
  </div>

  <footer class="footer">
    COPYRIGHT © 2026 台北一日遊
  </footer>



  <!-- 登入註冊彈窗，遮罩層預設隱藏 -->
  <div class="dialog-backdrop hidden">
    <div class="dialog">
      <div class="dialog-bar"></div>
      <img class="dialog-close" src="/static/images/icon_close.svg" alt="關閉">

      <!-- 登入表單 -->
      <div class="dialog-form" id="signin-form">
        <h2>登入會員帳號</h2>
        <input type="email" class="dialog-input" id="signin-email" placeholder="輸入電子信箱">
        <input type="password" class="dialog-input" id="signin-password" placeholder="輸入密碼">
        <button class="dialog-btn" id="signin-btn">登入帳戶</button>
        <p class="dialog-message" id="signin-message"></p>
        <p class="dialog-switch" id="to-signup">還沒有帳戶？點此註冊</p>
      </div>

      <!-- 註冊表單，預設隱藏 -->
      <div class="dialog-form hidden" id="signup-form">
        <h2>註冊會員帳號</h2>
        <input type="text" class="dialog-input" id="signup-name" placeholder="輸入姓名">
        <input type="email" class="dialog-input" id="signup-email" placeholder="輸入電子郵件">
        <input type="password" class="dialog-input" id="signup-password" placeholder="輸入密碼">
        <button class="dialog-btn" id="signup-btn">註冊新帳戶</button>
        <p class="dialog-message" id="signup-message"></p>
        <p class="dialog-switch" id="to-signin">已經有帳戶了？點此登入</p>
      </div>
    </div>
  </div>

  <script src="/static/dialog/dialog.js"></script>
  <script src="/static/attraction/attraction.js"></script>
</body>

</html>
