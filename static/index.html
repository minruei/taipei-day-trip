<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Index</title>
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <nav class="navbar">
    <a class="logo">台北一日遊</a>
    <ul>
      <li>預定行程</li>
      <li>登入/註冊</li>
    </ul>
  </nav>

  <section class="banner">
    <h2 class="banner-title">輕鬆享受台北一日悠閒</h2>
    <p class="banner-desc">探索每個角落，體驗城市的深度旅遊行程</p>
    <div class="search-bar">
      <button class="category-btn">全部分類 ▾</button>

  <div class="attraction-section">

    <div class="mrt-bar">
      <button class="mrt-arrow-left"><img src="/static/arrow-left.svg" alt="上一頁"></button>
      <ul class="mrt-list">
        <li>劍潭</li>
        <li>圓山</li>
        <li>士林</li>
        <li>北投</li>
        <li>臺大醫院</li>
        <li>龍山寺</li>
        <li>西門</li>
      </ul>
      <button class="mrt-arrow-right"><img src="/static/arrow-right.svg" alt="下一頁"></button>
    </div>

    <div class="attraction-list"></div>

    <div class="sentinel"></div>

  <footer class="footer">
    COPYRIGHT © 2026 台北一日遊
  </footer>
